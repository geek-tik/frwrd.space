services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-forward}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forward}
      POSTGRES_DB: ${POSTGRES_DB:-forward}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-forward} -d ${POSTGRES_DB:-forward}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: deploy/docker/server.Dockerfile
    entrypoint: ["/app/migrate"]
    command: ["up"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://forward:forward@postgres:5432/forward?sslmode=disable}
      MIGRATIONS_DIR: /app/migrations
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  server:
    build:
      context: .
      dockerfile: deploy/docker/server.Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://forward:forward@postgres:5432/forward?sslmode=disable}
      BASE_DOMAIN: ${BASE_DOMAIN:-frwrd.space}
      HTTP_ADDR: ${HTTP_ADDR:-:8080}
      EDGE_ADDR: ${EDGE_ADDR:-:8081}
      AGENT_ADDR: ${AGENT_ADDR:-:8082}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
    ports:
      - "${FORWARD_BIND:-127.0.0.1}:8080:8080"
      - "${FORWARD_BIND:-127.0.0.1}:8081:8081"
      - "${FORWARD_BIND:-127.0.0.1}:8082:8082"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: deploy/docker/web.Dockerfile
    restart: unless-stopped
    ports:
      - "${FORWARD_BIND:-127.0.0.1}:${WEB_PORT:-3080}:80"
    depends_on:
      server:
        condition: service_healthy

  agent:
    build:
      context: .
      dockerfile: deploy/docker/agent.Dockerfile
    profiles:
      - tunnel
    extra_hosts:
      - "host.docker.internal:host-gateway"
    dns_search: []
    environment:
      FORWARD_SERVER_URL: ${FORWARD_SERVER_URL:-ws://server:8082/agent/connect}
      FORWARD_API_TOKEN: ${FORWARD_API_TOKEN:-}
      FORWARD_LOCAL_HOST: ${FORWARD_LOCAL_HOST:-host.docker.internal}
      FORWARD_DASHBOARD_URL: ${FORWARD_DASHBOARD_URL:-http://localhost:3080}
    depends_on:
      server:
        condition: service_healthy

  demo-app:
    image: python:3-alpine
    profiles:
      - tunnel
    command: sh -c 'mkdir -p /srv && echo "Hello from Forward tunnel" > /srv/index.html && python -m http.server 3000 --directory /srv'
    depends_on:
      server:
        condition: service_healthy

volumes:
  postgres_data:
