# /etc/nginx/sites-available/forward (prod)

server {
    listen 80;
    server_name frwrd.space www.frwrd.space;
    return 301 https://frwrd.space$request_uri;
}

server {
    listen 80;
    server_name api.frwrd.space connect.frwrd.space;
    return 301 https://$host$request_uri;
}

server {
    listen 80;
    server_name ~^(?<subdomain>(?!www|api|connect)[a-z0-9-]+)\.frwrd\.space$;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.frwrd.space;

    ssl_certificate     /etc/letsencrypt/live/frwrd.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/frwrd.space/privkey.pem;

    return 301 https://frwrd.space$request_uri;
}

# --- HTTPS ---

server {
    listen 443 ssl http2;
    server_name frwrd.space;

    ssl_certificate     /etc/letsencrypt/live/frwrd.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/frwrd.space/privkey.pem;

    auth_basic           "Forward private";
    auth_basic_user_file /etc/nginx/htpasswd/forward;

    location / {
        proxy_pass http://127.0.0.1:3131;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl http2;
    server_name api.frwrd.space;

    ssl_certificate     /etc/letsencrypt/live/frwrd.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/frwrd.space/privkey.pem;

    #    auth_basic           "Forward private";
    #    auth_basic_user_file /etc/nginx/htpasswd/forward;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl http2;
    server_name connect.frwrd.space;

    ssl_certificate     /etc/letsencrypt/live/frwrd.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/frwrd.space/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}

server {
    listen 443 ssl http2;
    server_name ~^(?<subdomain>(?!www|api|connect)[a-z0-9-]+)\.frwrd\.space$;

    ssl_certificate     /etc/letsencrypt/live/frwrd.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/frwrd.space/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
